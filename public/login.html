<!DOCTYPE html>
<html lang="nl">
<head>
  <script>try{if(localStorage.getItem('ks_theme')==='dark')document.documentElement.dataset.theme='dark';}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Keyservice CRM — Inloggen</title>
  <link rel="icon" type="image/svg+xml" href="/img/mark.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1d4f9c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Keyservice" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="login-body">
  <form id="loginForm" class="login-card">
    <img src="/img/logo.svg" alt="Keyservice — Service is key" class="login-logo" />
    <h1>CRM Dashboard</h1>
    <p class="muted">Log in om verder te gaan</p>
    <label>E-mailadres
      <input type="email" name="email" autocomplete="username" required placeholder="naam@keyservice.nl" />
    </label>
    <label>Wachtwoord
      <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••" />
    </label>
    <button type="submit" class="btn btn-primary btn-block">Inloggen</button>
    <p id="loginError" class="error" hidden></p>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const errEl = document.getElementById('loginError');
    const knop = form.querySelector('button[type=submit]');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.hidden = true;
      // Knop blokkeren tijdens de poging (audit 16 sep): dubbel tikken bij een trage
      // verbinding telde als meerdere inlogpogingen en liep tegen de login-rem aan.
      knop.disabled = true; knop.textContent = 'Bezig…';
      const body = { email: form.email.value, password: form.password.value };
      try {
        const res = await fetch('/api/login', {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
        });
        if (res.ok) { window.location.href = '/'; return; }
        const data = await res.json().catch(() => ({}));
        errEl.textContent = data.error || (res.status === 429 ? 'Te veel pogingen — wacht even en probeer opnieuw.' : 'Inloggen mislukt');
        errEl.hidden = false;
      } catch {
        errEl.textContent = 'Geen verbinding met de server — probeer het zo opnieuw.';
        errEl.hidden = false;
      } finally { knop.disabled = false; knop.textContent = 'Inloggen'; }
    });
  </script>
  <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }</script>
</body>
</html>
