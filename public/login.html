<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Keyservice CRM — Inloggen</title>
  <link rel="icon" type="image/svg+xml" href="/img/mark.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1d4f9c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Keyservice" />
  <link rel="apple-touch-icon" href="/img/mark.svg" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="login-body">
  <form id="loginForm" class="login-card">
    <img src="/img/logo.svg" alt="Keyservice — Service is key" class="login-logo" />
    <h1>CRM Dashboard</h1>
    <p class="muted">Log in om verder te gaan</p>
    <label>E-mailadres
      <input type="email" name="email" autocomplete="username" required placeholder="naam@keyservice.nl" />
    </label>
    <label>Wachtwoord
      <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••" />
    </label>
    <button type="submit" class="btn btn-primary btn-block">Inloggen</button>
    <p id="loginError" class="error" hidden></p>
    <p class="muted small">Demo-account: <strong>admin@keyservice.nl</strong> / <strong>admin123</strong></p>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const errEl = document.getElementById('loginError');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.hidden = true;
      const body = { email: form.email.value, password: form.password.value };
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
      });
      if (res.ok) {
        window.location.href = '/';
      } else {
        const data = await res.json().catch(() => ({}));
        errEl.textContent = data.error || 'Inloggen mislukt';
        errEl.hidden = false;
      }
    });
  </script>
  <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }</script>
</body>
</html>
